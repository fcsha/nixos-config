[Metadata]
Name=fc
Version=1
Author=Fucheng Sha

# Colors:
#   Panel BG:    zinc-950 80%  = #09090bCC
#   Text:        zinc-50       = #fafafaff
#   Index:       zinc-500      = #71717aff
#   Highlight:   emerald-500   = #10b981ff
#   Highlight BG: emerald 20%  = #10b98133

[InputPanel]
# 普通候选词文字颜色 (zinc-50)
NormalColor=#fafafaff

# 选中候选词文字颜色 (emerald-500)
HighlightCandidateColor=#10b981ff

#======== 面板背景 ========
[InputPanel/Background]
# zinc-950 80%
Color=#09090bcc
BorderWidth=0

# 面板内边距 (p-1 = 4px)
[InputPanel/Background/Margin]
Left=4
Right=4
Top=4
Bottom=4

# 面板内容区边距
[InputPanel/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

# 每个候选词文字内边距 (px-2 py-1)
[InputPanel/TextMargin]
Left=8
Right=8
Top=4
Bottom=4

#======== 选中项高亮背景 ========
[InputPanel/Highlight]
# emerald-500 20%
Color=#10b98133
BorderWidth=0

# 选中项内边距
[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=4
Bottom=4
